name: Azure Static Web Apps CI/CD
 
on:
  push:
    branches:
      - 31-07-2026
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - 31-07-2026
 
jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
 
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: Angular/my-app/package-lock.json
 
      - name: Install dependencies
        working-directory: Angular/my-app
        run: npm ci
 
      - name: Build Angular
        working-directory: Angular/my-app
        run: npm run build
 
      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLUE_SEA_076C85103 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
 
          skip_app_build: true
 
          app_location: "Azure/my-app"
          output_location: ""
          api_location: ""
 
  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
 
    runs-on: ubuntu-latest
 
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLUE_SEA_076C85103 }}
          action: close
