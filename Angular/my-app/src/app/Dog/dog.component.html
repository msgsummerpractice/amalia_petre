<div class="w-full h-200 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500">
  <header>
    <mat-toolbar color="primary-container" id="toolbar">
      <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="home"
        ><a mat-button href="https://material.angular.dev/components/toolbar/examples"></a
      ></mat-icon>

      <a mat-button href="https://www.notino.ro/">Products</a>
      <a mat-button href="https://www.google.com/finance/beta">Pricing</a>
      <a mat-button>About</a>
    </mat-toolbar>

    <div class="flex justify-end p-4">
      <mat-icon
        aria-hidden="false"
        aria-label="Example home icon"
        fontIcon="account_circle"
      ></mat-icon>
    </div>
  </header>

  <main>
    <div class="text-center mb-10 p-12">
      <h1 class="text-4xl font-bold mb-4">Dog Gallery</h1>
      <p class="text-lg text-gray-700">Different types of dogs</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 p-8">
      <div class="bg-[#FFC2DC] rounded-lg shadow-md p-6">
        <h2 class="text-2xl font-semibold mb-2">French Bulldog</h2>
        <p class="text-gray-600">Small dog breed</p>
      </div>

      <div class="bg-[#EED6FF] rounded-lg shadow-md p-6">
        <h2 class="text-2xl font-semibold mb-2">German Shepherd</h2>
        <p class="text-gray-600">Large dog breed</p>
      </div>

      <div class="bg-[#D6F1FF] rounded-lg shadow-md p-6">
        <h2 class="text-2xl font-semibold mb-2">Golden Retriever</h2>
        <p class="text-gray-600">Medium to large dog breed</p>
      </div>
    </div>

    <div class="container">
      <h1>Random Dog Image</h1>
      <div *ngIf="dogs$ | async as dogs">
        <img [src]="dogs.message" alt="Random Dog" />
      </div>
    </div>
  </main>
</div>
