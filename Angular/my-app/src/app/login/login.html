<div class="w-full h-full bg-gradient-to-r from-[#EEAECA] via-[#AEEED3] to-[#EEAECA]">
    <div class="bg-[#D6F1FF] rounded-[30px] shadow-md p-6 w-90 h-120 flex flex-col items-center mx-auto">
        <h2 class="text-2xl font-semibold mb-2">Login</h2>
        <p class="text-gray-600 mt-2">Please enter your credentials to log in.</p>
        <form class="mt-15 space-y-15" method="POST">
            <input
                type="text"
                placeholder="Username"
                class="border border-gray-300 rounded px-4 py-2 mb-4 w-full bg-white"
            />
            <input
                type="password"
                placeholder="Password"
                class="border border-gray-300 rounded px-4 py-2 mb-4 w-full bg-white"
            />
        </form>
        <input
            type="submit"
            value="Login"
            class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-3 px-5 rounded-[20px] cursor-pointer mt-6"
        />
    </div>
</div>
